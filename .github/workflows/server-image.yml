# Builds the dedicated server image (server/Dockerfile) from this repository and pushes it to the GitHub container
# registry as ghcr.io/<owner>/superkillers-server, tagged latest and with the commit's sha.
name: server image

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'server/**'
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# a newer push supersedes a build still running, so latest is the newest game
concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/superkillers-server"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -f server/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image:latest" -t "$image:$GITHUB_SHA" .
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
